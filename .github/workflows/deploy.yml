name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'prisma/**'
      - 'public/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 미니 PC 의 공용 compose 를 여러 프로젝트가 공유한다. 동시에 돌면 rsync 와
# docker build 가 서로를 밟는다. 순차 실행하되 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: hellchang-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PC_SSH_KEY }}" > ~/.ssh/pc_key
          chmod 600 ~/.ssh/pc_key
          ssh-keyscan -T 10 -H "${{ secrets.PC_SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null || true
          test -s ~/.ssh/known_hosts

      - name: Compose runtime .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.HELLCHANG_POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KAKAO_ID: ${{ secrets.AUTH_KAKAO_ID }}
          AUTH_KAKAO_SECRET: ${{ secrets.AUTH_KAKAO_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          # 값 없이 배포되면 런타임에야 드러난다. 여기서 먼저 끊는다.
          for name in POSTGRES_PASSWORD AUTH_SECRET; do
            eval "value=\${$name}"
            test -n "$value" || { echo "::error::$name 시크릿이 비어 있습니다"; exit 1; }
          done

          : > hellchang-web.env
          echo "NODE_ENV=production" >> hellchang-web.env
          echo "DATABASE_URL=postgresql://hellchang:${POSTGRES_PASSWORD}@hellchang-db:5432/hellchang" >> hellchang-web.env
          echo "AUTH_URL=https://hellchang.rheon.kr" >> hellchang-web.env
          echo "AUTH_TRUST_HOST=true" >> hellchang-web.env
          for name in AUTH_SECRET AUTH_KAKAO_ID AUTH_KAKAO_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET; do
            eval "value=\${$name}"
            test -n "$value" && printf '%s=%s\n' "$name" "$value" >> hellchang-web.env
          done

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/pc_key \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }} \
            "mkdir -p ~/servers/hellchang/repo"
          scp -i ~/.ssh/pc_key -o StrictHostKeyChecking=no hellchang-web.env \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }}:~/servers/hellchang/hellchang-web.env
          rm -f hellchang-web.env

      - name: Checkout
        uses: actions/checkout@v4

      # 서버가 GitHub 에서 pull 하지 않는다. 러너가 소스를 밀어넣는 쪽이
      # 서버에 자격증명을 두지 않아도 되어 깔끔하다.
      - name: Sync source to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/pc_key -o StrictHostKeyChecking=no" \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.env' \
            ./ ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }}:~/servers/hellchang/repo/

      - name: Deploy
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no \
            -i ~/.ssh/pc_key \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }} bash -s <<'REMOTE'
          set -e
          cd ~/servers
          docker compose up -d --build --no-deps hellchang-db hellchang-web

          echo '⏳ 기동 대기...'
          sleep 12
          docker compose logs --tail=30 hellchang-web
          for name in hellchang-db hellchang-web; do
            docker inspect -f '{{.State.Running}}' "$name" | grep -q true \
              || { echo "❌ $name 기동 실패"; docker logs "$name" --tail=40; exit 1; }
          done
          docker image prune -f >/dev/null
          echo '✅ 배포 완료 — https://hellchang.rheon.kr'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/pc_key
