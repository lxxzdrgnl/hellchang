<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 헬창 아이콘 — 굽힌 팔(이두). 위팔은 가로, 아래팔은 위로 꺾이고
       그 사이에 이두가 볼록하다. 굵은 라운드 스트로크라 16px 파비콘에서도
       실루엣이 뭉개지지 않는다. -->
  <rect width="96" height="96" rx="21" fill="#0b0d0c"/>
  <g stroke="#4ade80" stroke-width="17" stroke-linecap="round" fill="none">
    <path d="M20 65 H55"/>
    <path d="M56 64 V33"/>
  </g>
  <circle cx="40" cy="50" r="13" fill="#4ade80"/>
  <circle cx="56" cy="28" r="11" fill="#4ade80"/>
